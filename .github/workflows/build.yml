name: build

# CI de cada push — compila solo el target que nos interesa (1.21.1-neoforge).
# Upstream buildea toda la matriz stonecutter; nosotros solo distribuimos el
# loader de NeoForge 1.21.1, asi que el resto es ruido y minutos de CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Core tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :core:test --no-daemon

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build 1.21.1-neoforge
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :1.21.1-neoforge:build -x :core:test --no-daemon --stacktrace

      - name: Upload merged jar
        uses: actions/upload-artifact@v6
        with:
          name: suiteland-updater-jar
          path: merged/*.jar
          if-no-files-found: error
          retention-days: 30
