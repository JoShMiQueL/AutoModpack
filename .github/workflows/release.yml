name: release

# ============================================================================
#  suiteland-updater release pipeline
#
#  Versionado propio: 4.0.7-suiteland.N  (4.0.7 = base upstream del rebase,
#  N = revision nuestra). release-please quiere semver plano, asi que NO se
#  usa rp aqui — los tags se crean manualmente o por dispatch con `version`.
#  Este workflow se dispara en el tag push, compila el jar merged y lo
#  adjunta a la Release.
#
#  CHANGELOG.md se mantiene a mano (es corto y estable — el fork solo cambia
#  cuando hay rebase de upstream o tweak de branding).
#
#    git tag v4.0.7-suiteland.3 && git push --tags   → release automatica
#    Actions → release → Run workflow (version)      → lo mismo sin tag local
# ============================================================================

on:
  push:
    tags: ["v*suiteland*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version a liberar, ej. 4.0.7-suiteland.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Metadata de la release via el reusable general (sin rp — tags manuales)
  release:
    uses: JoShMiQueL/gh-actions/.github/workflows/release.yml@main
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    with:
      version: ${{ inputs.version }}
      release-please: false
      release-title: "Suiteland Updater {version}"
      contributors: false
      release-notes: |
        ### Install
        Server y clientes solo necesitan este jar en `mods/` — el resto del
        pack se sincroniza solo. Eliminar cualquier `automodpack*.jar` viejo
        y la carpeta `automodpack/` de instalaciones anteriores.

  build-release:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$INPUT_VERSION"
          fi
          [ -z "$v" ] && { echo "::error::no version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building suiteland-updater $v"

      # El version del fork vive en gradle.properties (mod_version) — se pina
      # al tag antes de compilar para que el jar salga con el nombre correcto.
      - name: Pin gradle.properties to release version
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          sed -i "s/^mod_version = .*/mod_version = $VER/" gradle.properties
          grep "^mod_version" gradle.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :1.21.1-neoforge:build -x :core:test --no-daemon --stacktrace

      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          tag="v$VER"
          ls merged/
          for jar in merged/suiteland-updater-*.jar; do
            [ -e "$jar" ] || { echo "::error::no merged jar"; exit 1; }
            echo "attaching $jar"
            gh release upload "$tag" "$jar" --clobber --repo "${{ github.repository }}"
          done

  # Tras releasear, master debe llevar la version nueva en gradle.properties
  sync-version:
    needs: build-release
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Bump mod_version
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          v="${VER#v}"
          sed -i "s/^mod_version = .*/mod_version = $v/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet gradle.properties; then
            echo "already at $v"
          else
            git add gradle.properties
            git commit -m "chore: release $v — sync mod_version"
            git push origin main
          fi
